name: Sync classroom data

on:
  workflow_dispatch:
    inputs:
      transport:
        type: choice
        options: [teredo, warp]
        default: teredo
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.transport == 'teredo' && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./scraper

      - name: Fetch over Windows IPv6
        if: inputs.transport == 'teredo'
        shell: pwsh
        run: |
          Start-Service iphlpsvc
          netsh interface teredo set state type=enterpriseclient
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $site = 'jwc.jxnu.edu.cn'
          $dns = Invoke-RestMethod "https://dns.google/resolve?name=$site&type=AAAA"
          $address = ($dns.Answer | Where-Object type -eq 28 | Select-Object -First 1).data
          if (-not $address) { throw 'Source AAAA record missing' }
          try {
            foreach ($page in 1, 2) {
              $file = Join-Path $env:RUNNER_TEMP "classroom-$page.html"
              curl.exe --fail --silent --show-error --ipv6 --noproxy '*' --resolve ("{0}:443:[{1}]" -f $site,$address) --connect-timeout 10 --max-time 40 --retry 2 --retry-delay 5 --retry-all-errors -o $file "https://$site/MyControl/Public_ClassRoom.aspx?t=$page"
              if ($LASTEXITCODE -ne 0) { throw "Source fetch failed for t=$page" }
            }
          } finally {
            netsh interface teredo show state
          }

      - name: Fetch over WARP local proxy
        if: inputs.transport == 'warp'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ noble main' | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc
          sudo warp-cli --accept-tos registration new
          trap 'sudo warp-cli --accept-tos disconnect; sudo warp-cli --accept-tos registration delete' EXIT
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          trace="https://www.cloudflare.com/cdn-cgi/trace"
          ready=false
          for attempt in {1..12}; do
            if curl -fsS --proxy socks5h://127.0.0.1:40000 --max-time 5 "$trace" | grep -qx 'warp=on'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then exit 1; fi
          for page in 1 2; do
            curl -fsS --proxy socks5h://127.0.0.1:40000 --connect-timeout 12 --max-time 45 -o "$RUNNER_TEMP/classroom-$page.html" "https://jwc.jxnu.edu.cn/MyControl/Public_ClassRoom.aspx?t=$page"
          done

      - name: Validate both live timetables
        shell: python
        run: |
          import os
          from pathlib import Path
          from jxnu_classroom.parser import parse
          from jxnu_classroom.builder import merge_pages

          directory = Path(os.environ["RUNNER_TEMP"])
          pages = []
          for page_no in (1, 2):
              page = parse((directory / f"classroom-{page_no}.html").read_text(encoding="utf-8"))
              if not page.rooms or not page.semester:
                  raise SystemExit(f"Invalid timetable on page {page_no}")
              pages.append(page)
              print(f"Page {page_no}: {len(page.rooms)} rooms")
          merged = merge_pages(pages)
          print(f"Merged {len(merged.rooms)} rooms")
