name: Sync classroom data

on:
  schedule:
    # 每天北京时间 06:17(UTC 22:17),错峰避开服务器整点压力
    - cron: '17 22 * * *'
  workflow_dispatch:    # 允许手动触发

permissions:
  contents: write       # 允许 commit 回 main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper
        working-directory: scraper
        run: pip install -e .

      - name: Resolve classroom source
        env:
          JWC_HTTPS_PROXY: ${{ secrets.JWC_HTTPS_PROXY }}
        shell: python
        run: |
          import ipaddress
          import json
          import os
          import socket
          import subprocess
          from urllib.request import urlopen

          if os.environ.get("JWC_HTTPS_PROXY"):
              print("Source DNS will be resolved by the configured HTTPS proxy")
              raise SystemExit(0)

          hostname = "jwc.jxnu.edu.cn"
          try:
              records = socket.getaddrinfo(hostname, 443, family=socket.AF_INET)
          except socket.gaierror as error:
              print(f"System DNS failed for {hostname}: {error}", flush=True)
          else:
              print(f"System DNS resolved {hostname}: {sorted({record[4][0] for record in records})}")
              raise SystemExit(0)

          for resolver in ("https://dns.google/resolve", "https://dns.alidns.com/resolve"):
              try:
                  with urlopen(f"{resolver}?name={hostname}&type=A", timeout=15) as response:
                      result = json.load(response)
                  if result.get("Status") != 0:
                      raise ValueError(f"DNS response status: {result.get('Status')}")
                  addresses = [
                      ipaddress.IPv4Address(record["data"])
                      for record in result.get("Answer", [])
                      if record.get("type") == 1
                  ]
                  addresses = [str(address) for address in addresses if address.is_global]
                  if not addresses:
                      raise ValueError("DNS response contains no public IPv4 addresses")
              except (OSError, ValueError, KeyError) as error:
                  print(f"DNS fallback {resolver} failed: {error}", flush=True)
                  continue

              subprocess.run(
                  ["sudo", "tee", "-a", "/etc/hosts"],
                  input="\n" + "".join(f"{address} {hostname}\n" for address in addresses),
                  text=True,
                  check=True,
              )
              socket.getaddrinfo(hostname, 443, family=socket.AF_INET)
              print(f"Resolved {hostname} using {resolver}")
              break
          else:
              raise SystemExit(f"Unable to resolve {hostname}; classroom data was not changed")

      - name: Sync classroom data
        env:
          JWC_HTTPS_PROXY: ${{ secrets.JWC_HTTPS_PROXY }}
        run: |
          python -m jxnu_classroom.cli sync -v --output data/classrooms.json
        working-directory: ${{ github.workspace }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/classrooms.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classrooms.json
          git commit -m "data: sync classroom data ($(date -u +%Y-%m-%d))"
          git push
