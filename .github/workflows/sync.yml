name: Sync classroom data

on:
  schedule:
    # 每天北京时间 06:17(UTC 22:17),错峰避开服务器整点压力
    - cron: '17 22 * * *'
  workflow_dispatch:    # 允许手动触发

permissions:
  contents: write       # 允许 commit 回 main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper
        working-directory: scraper
        run: pip install -e .

      - name: Sync classroom data
        run: |
          python -m jxnu_classroom.cli sync -v --output data/classrooms.json
        working-directory: ${{ github.workspace }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/classrooms.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classrooms.json
          git commit -m "data: sync classroom data ($(date -u +%Y-%m-%d))"
          git push
