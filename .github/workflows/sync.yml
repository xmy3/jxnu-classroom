name: Sync classroom data

on:
  schedule:
    # 每天北京时间 06:17(UTC 22:17),错峰避开服务器整点压力
    - cron: '17 22 * * *'
  workflow_dispatch:    # 允许手动触发

permissions:
  contents: write       # 允许 commit 回 main

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper
        working-directory: scraper
        run: pip install -e .

      - name: Sync classroom data
        env:
          JWC_HTTPS_PROXY: ${{ secrets.JWC_HTTPS_PROXY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$JWC_HTTPS_PROXY" ]]; then
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
            echo 'deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ noble main' | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq cloudflare-warp
            sudo systemctl start warp-svc
            sudo warp-cli --accept-tos registration new
            trap 'sudo warp-cli --accept-tos disconnect || true; sudo warp-cli --accept-tos registration delete' EXIT
            sudo warp-cli --accept-tos mode proxy
            sudo warp-cli --accept-tos proxy port 40000
            sudo warp-cli --accept-tos connect
            export JWC_HTTPS_PROXY=socks5h://127.0.0.1:40000
            for attempt in {1..12}; do
              if curl -fsS --proxy "$JWC_HTTPS_PROXY" --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -qx 'warp=on'; then
                echo "WARP connected"
                break
              fi
              if (( attempt == 12 )); then
                echo "::error::WARP proxy did not become ready"
                exit 1
              fi
              sleep 2
            done
          fi
          python -m jxnu_classroom.cli sync -v --output data/classrooms.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/classrooms.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classrooms.json
          git commit -m "data: sync classroom data ($(date -u +%Y-%m-%d))"
          git push
