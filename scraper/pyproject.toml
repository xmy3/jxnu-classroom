[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jxnu-classroom"
version = "0.1.0"
description = "江西师范大学空闲教室查询 - 教务系统爬虫"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "lxml>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
]

[project.scripts]
jxnu-classroom = "jxnu_classroom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jxnu_classroom"]
